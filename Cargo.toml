[workspace]
members = [
    "crates/czi-app",
    "crates/czi-core",
    "crates/czi-ssh",
    "crates/czi-ssh-darwin",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
