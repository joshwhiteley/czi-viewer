[package]
name = "czi-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
czi-core = { path = "../czi-core" }
czi-ssh = { path = "../czi-ssh" }
eframe = { version = "=0.32.3", default-features = false, features = ["wgpu", "default_fonts"] }
png = { version = "0.18", default-features = false }
wgpu = { version = "=25.0.2", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
czi-ssh-darwin = { path = "../czi-ssh-darwin" }

[lints]
workspace = true
