[package]
name = "czi-viewer"
version = "0.1.0"
description = "Native macOS viewer for CZI microscopy images"
homepage = "https://github.com/joshwhiteley/czi-viewer"
repository = "https://github.com/joshwhiteley/czi-viewer"
keywords = ["czi", "microscopy", "macos"]
categories = ["science"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.macos-preview]
product-name = "CZI Viewer"
bundle-identifier = "io.github.joshwhiteley.czi-viewer"
target = "aarch64-apple-darwin"
minimum-system-version = "11.0"
signing = "ad-hoc"

[dependencies]
czi-core = { path = "../czi-core" }
czi-ssh = { path = "../czi-ssh" }
eframe = { version = "=0.32.3", default-features = false, features = ["wgpu", "default_fonts"] }
png = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wgpu = { version = "=25.0.2", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
czi-ssh-darwin = { path = "../czi-ssh-darwin" }
rfd = { version = "0.17.2", default-features = false }

[lints]
workspace = true
