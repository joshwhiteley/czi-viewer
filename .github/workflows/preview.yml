name: macOS Preview

on:
  workflow_dispatch:
  push:
    tags:
      - "preview-*"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: aarch64-apple-darwin
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.13"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install packaging tools
        run: |
          cargo install cargo-about --version 0.8.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Package preview
        run: scripts/package-macos.sh
      - name: Verify preview
        run: scripts/verify-macos-release.sh
      - name: Attest release artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/*.cdx.json
            dist/*NOTICES.html
            dist/SHA256SUMS
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: czi-viewer-macos-preview
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.cdx.json
            dist/*NOTICES.html
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
