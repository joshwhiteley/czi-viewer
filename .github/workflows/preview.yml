name: macOS Preview

on:
  workflow_dispatch:
  push:
    tags:
      - "preview-*"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: aarch64-apple-darwin
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.13"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install packaging tools
        run: |
          cargo install cargo-about --version 0.8.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Package preview
        run: scripts/package-macos.sh
      - name: Verify preview
        run: scripts/verify-macos-release.sh
      - name: Attest release artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/*.cdx.json
            dist/*NOTICES.html
            dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: czi-viewer-macos-preview
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/preview-')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: czi-viewer-macos-preview
          path: dist
      - name: Publish prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: CZI Viewer ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body_path: .github/preview-release-notes.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.cdx.json
            dist/*NOTICES.html
            dist/SHA256SUMS
